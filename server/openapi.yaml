openapi: 3.0.3
info:
  title: Brightloop Subscription Management API
  version: 1.0.0
  description: REST API for customers, catalog, subscriptions, billing, invoices and payments.
servers:
  - url: http://localhost:5000/api/v1
paths:
  /auth/signup:
    post:
      summary: Create a customer account
      responses: {'201': {description: Created}}
  /auth/login:
    post:
      summary: Authenticate
      responses: {'200': {description: Authenticated}}
  /auth/me:
    get:
      security: [{bearerAuth: []}]
      responses: {'200': {description: Current user}}
  /resources/{resource}:
    get:
      summary: Paginated catalog or customer list
      parameters:
        - in: path
          name: resource
          required: true
          schema: {type: string, enum: [products, plans, taxes, discounts, customers, templates]}
      responses: {'200': {description: List}}
    post:
      summary: Create resource (role restricted)
      responses: {'201': {description: Created}}
  /subscriptions:
    get:
      summary: List subscriptions
      responses: {'200': {description: Paginated subscriptions}}
    post:
      summary: Create subscription
      responses: {'201': {description: Created}}
  /subscriptions/{id}/transition:
    post:
      summary: Transition subscription lifecycle
      responses: {'200': {description: Updated}}
  /invoices:
    get:
      summary: List invoices
      responses: {'200': {description: Paginated invoices}}
  /invoices/{id}/payments:
    post:
      summary: Record partial or full payment
      responses: {'201': {description: Payment recorded}}
  /billing/run:
    post:
      summary: Run due invoice generation
      responses: {'200': {description: Billing summary}}
  /reports/summary:
    get:
      summary: Finance dashboard summary
      responses: {'200': {description: Summary}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
